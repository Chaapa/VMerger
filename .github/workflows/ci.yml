name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r requirements.lock
      - run: npm install -g pnpm@11.25.0
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web run build && pnpm --dir web run test
      - run: python scripts/configure.py
      - run: docker compose -f compose.yaml -f deploy/compose.ci.yaml config --quiet
      - run: docker compose -f compose.yaml -f deploy/compose.ci.yaml up --build -d api worker
      - name: Wait for service readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/readyz; then exit 0; fi
            sleep 3
          done
          docker compose logs --tail=80
          exit 1
      - run: ruff check vmerger migrations tests
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pytest --integration --cov=vmerger --cov-report=xml --cov-report=json:.local/coverage.json --cov-fail-under=85
      - run: python scripts/check_coverage.py
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web exec playwright test
      - name: Verify monitoring configuration
        run: |
          docker compose --profile monitoring up -d prometheus grafana
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9090/-/ready && curl --fail --silent http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: |
            coverage.xml
            .local/coverage.json
            web/test-results/
            docs/images/
      - if: always()
        run: docker compose --profile monitoring -f compose.yaml -f deploy/compose.ci.yaml down -v
