[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vmerger"
version = "0.1.0"
description = "Chat-directed video stories with private S3 media storage"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "pydantic-settings", "psycopg[binary]", "boto3", "google-genai", "alembic", "prometheus-client", "itsdangerous"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "httpx", "hypothesis", "ruff"]

[tool.setuptools.packages.find]
include = ["vmerger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL, S3 and FFmpeg"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["vmerger"]

[tool.coverage.report]
show_missing = true

