services:
  api:
    environment:
      COOKIE_SECURE: "true"
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN}
  caddy:
    image: caddy:2.10.2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
